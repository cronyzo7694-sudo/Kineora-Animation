<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kineora Animation — 2D Animation Editor</title>
    <style>
      /* Kineora design tokens (SYS-01 theme contract). Shell chrome references
         these; subsystem components adopt them as they are built. Dark is the
         complete default theme; a light theme is a token swap once every
         system adopts these variables (not a fake half-theme toggle). */
      :root {
        --kineora-bg: #101010;
        --kineora-panel: #1e1e1e;
        --kineora-panel-2: #161616;
        --kineora-chrome: #2a2a2a;
        --kineora-dropdown: #232323;
        --kineora-surface: #1d1d1d;      /* dialog / elevated surface */
        --kineora-input-bg: #111111;
        --kineora-input-border: #444444;
        --kineora-btn-bg: #2a2a2a;
        --kineora-btn-border: #555555;
        --kineora-btn-primary-bg: #0a3f7f;
        --kineora-btn-primary-border: #0a7cff;
        --kineora-text: #ddd;
        --kineora-text-bright: #eeeeee;
        --kineora-muted: #888;
        --kineora-disabled-text: #777;
        --kineora-accent: #0a7cff;
        --kineora-accent-text: #8ec8ff;
        --kineora-focus-ring: #8ec8ff;
        --kineora-border: #333;
        --kineora-border-2: #3a3a3a;
        --kineora-danger: #e66;
        --kineora-ok: #4a4;
        --kineora-warning: #eec13b;
      }
      /* Keyboard focus visibility (INV-VIS-4): a visible ring on every
         interactive control — no focus means no keyboard access. */
      :focus-visible {
        outline: 2px solid var(--kineora-focus-ring);
        outline-offset: 1px;
      }
      /* Kill the browser's default page margin (the white gap around the app). */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: #101010;
        color: #ddd;
      }
      /* Kineora custom scrollbars — thin, blue, dark track (WebKit + Firefox). */
      * {
        scrollbar-width: thin;
        scrollbar-color: #3b82f0 #1c1c1c;
      }
      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      *::-webkit-scrollbar-track {
        background: #1c1c1c;
      }
      *::-webkit-scrollbar-thumb {
        background: #3b82f0;
        border-radius: 4px;
        border: 2px solid #1c1c1c;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: #6aa5f5;
      }
      *::-webkit-scrollbar-corner {
        background: #1c1c1c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
