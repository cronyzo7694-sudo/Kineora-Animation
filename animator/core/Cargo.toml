[package]
name = "animator-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "animator_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]   # rlib: native/Cargo-test; cdylib: wasm32 build

[[bin]]
name = "animator"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
